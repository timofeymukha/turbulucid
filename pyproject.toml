[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "turbulucid"
version = "0.5"
description = "A package for post-processing of 2D flow fields."
authors = [
    { name = "Timofey Mukha", email = "timofey.mukha@protonmail.com" }
]
license = "GPL-3.0-or-later"
license-files = ["LICENSE.txt"]
readme = "README.rst"
requires-python = ">=3.10"
keywords = [
    "CFD",
    "VTK",
    "flow visualization",
    "post-processing",
    "turbulence",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
]
# Lower bounds reflect the APIs the code actually uses: the vtkmodules
# layout and vtkCellArray.GetOffsetsArray() need VTK 9, and
# scipy.integrate.simpson was introduced in SciPy 1.6.
dependencies = [
    "numpy>=1.22",
    "scipy>=1.6",
    "matplotlib>=3.5",
    "vtk>=9.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/timofeymukha/turbulucid"
Documentation = "https://timofeymukha.github.io/turbulucid/"
Source = "https://github.com/timofeymukha/turbulucid"
Issues = "https://github.com/timofeymukha/turbulucid/issues"

[project.scripts]
averageAlongAxis = "turbulucid.bin.averageAlongAxis:main"

[tool.setuptools.packages.find]
where = ["."]
# Without these, namespace discovery also installs "docs" and "tests" as
# top-level packages, and every dataset subdirectory as a package of its own.
include = ["turbulucid*"]
namespaces = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "--strict-config --strict-markers -ra --import-mode=importlib"
filterwarnings = [
    # Anything unexpected should fail the suite rather than scroll past.
    "error",
    "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 88
extend-exclude = ["turbulucid/bin", "docs", "build"]

[tool.ruff.lint]
select = ["F", "E4", "E7", "E9", "B", "UP", "I"]
# SIM118 is deliberately absent: "key in obj" raises on the VTK
# dataset_adapter containers, so obj.keys() is not interchangeable there.
ignore = [
    "B008",
    "UP031",
]

[tool.ruff.lint.per-file-ignores]
"turbulucid/__init__.py" = ["F403"]
"tests/*" = ["B011"]
