[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "turbulucid"
version = "0.5"
description = "A package for post-processing of 2D flow fields."
authors = [
    { name = "Timofey Mukha", email = "timofey.mukha@protonmail.com" }
]
license = { text = "GNU GPL 3" }
readme = "README.rst"
requires-python = ">=3.10"
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)"
]
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "vtk"
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/timofeymukha/turbulucid"

[project.scripts]
averageAlongAxis = "turbulucid.bin.averageAlongAxis:main"

[tool.setuptools.packages.find]
where = ["."]
# Without these, namespace discovery also installs "docs" and "tests" as
# top-level packages, and every dataset subdirectory as a package of its own.
include = ["turbulucid*"]
namespaces = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "--strict-config --strict-markers -ra --import-mode=importlib"
filterwarnings = [
    # Anything unexpected should fail the suite rather than scroll past.
    "error",
    "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 88
extend-exclude = ["turbulucid/bin", "docs", "build"]

[tool.ruff.lint]
select = ["F", "E4", "E7", "E9", "B", "UP", "I"]
# SIM118 is deliberately absent: "key in obj" raises on the VTK
# dataset_adapter containers, so obj.keys() is not interchangeable there.
ignore = [
    "B008",
    "UP031",
]

[tool.ruff.lint.per-file-ignores]
"turbulucid/__init__.py" = ["F403"]
"tests/*" = ["B011"]
