[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "turbulucid"
version = "0.5"
description = "A package for post-processing of 2D flow fields."
authors = [
    { name = "Timofey Mukha", email = "timofey.mukha@protonmail.com" }
]
license = { text = "GNU GPL 3" }
readme = "README.rst"
requires-python = ">=3.10"
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)"
]
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "vtk"
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/timofeymukha/turbulucid"

[project.scripts]
averageAlongAxis = "turbulucid.bin.averageAlongAxis:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "--strict-config --strict-markers -ra"
filterwarnings = [
    "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning",
]
