name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install ruff
        run: python -m pip install ruff

      - name: Check lint rules
        run: ruff check --output-format github .

  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        # The full range declared by requires-python.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    env:
      MPLBACKEND: Agg

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: python -m pip install ".[test]"

      - name: Check installed dependencies
        run: python -m pip check

      - name: Run test suite
        run: python -m pytest

  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build the distributions
        run: |
          python -m pip install build twine
          python -m build

      - name: Check the metadata
        run: python -m twine check dist/*

      - name: Only turbulucid may be installed top level
        run: |
          python - <<'PY'
          import pathlib, sys, zipfile

          wheel = next(pathlib.Path("dist").glob("*.whl"))
          roots = {name.split("/")[0] for name in zipfile.ZipFile(wheel).namelist()}
          unexpected = roots - {"turbulucid", f"turbulucid-{wheel.stem.split('-')[1]}.dist-info"}
          if unexpected:
              sys.exit(f"unexpected top-level entries in the wheel: {sorted(unexpected)}")
          print("wheel contains:", sorted(roots))
          PY
