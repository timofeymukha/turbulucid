name: Publish

# Builds the distributions on every tag, publishes them to PyPI.
#
# Publishing uses PyPI Trusted Publishing (OpenID Connect), so no API token
# needs to be stored in the repository. Before the first release, register
# the publisher once at https://pypi.org/manage/account/publishing/ with:
#   PyPI project name: turbulucid
#   Owner:             timofeymukha
#   Repository:        turbulucid
#   Workflow name:     publish.yml
#   Environment:       pypi
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build the sdist and the wheel
        run: |
          python -m pip install build twine
          python -m build

      - name: Check the rendered metadata
        run: python -m twine check --strict dist/*

      - name: The tag must match the declared version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'PY'
          import os, pathlib, sys, tomllib

          declared = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          if declared != tag:
              sys.exit(f"tag {tag!r} does not match pyproject version {declared!r}")
          print(f"tag and version agree: {declared}")
          PY

      - name: Install the wheel into a clean environment and import it
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/python -m pip install --quiet dist/*.whl
          /tmp/check/bin/python -c "import turbulucid; print(turbulucid.Case)"
          /tmp/check/bin/averageAlongAxis --help > /dev/null

      - name: Upload the distributions
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    environment:
      name: pypi
      url: https://pypi.org/p/turbulucid

    permissions:
      # Required for Trusted Publishing.
      id-token: write

    steps:
      - name: Download the distributions
        uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
